# The rail, for Go repos.
#
# Installs a toolchain and runs `make check`. Nothing else. See README.md for
# why that constraint is load-bearing rather than stylistic.
#
# Third-party actions are pinned by commit SHA, not tag. A tag is mutable —
# whoever controls the action can repoint v7 at anything, and it would run with
# whatever permissions the calling workflow has. The trailing comment records
# the human-readable version so Renovate can still propose upgrades.
name: rail (go)

on:
  workflow_call:
    inputs:
      go-version:
        description: "Go toolchain version."
        type: string
        default: "1.26"
      working-directory:
        description: "Directory containing the Makefile."
        type: string
        default: "."
      runs-on:
        type: string
        default: "ubuntu-latest"

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.go-version }}
          # setup-go's built-in cache assumes a single go.sum at a known path.
          # Several of these repos have multiple modules, so we cache by hand
          # over every go.sum in the tree instead.
          cache: false

      - name: Cache Go modules and build output
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go${{ inputs.go-version }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go${{ inputs.go-version }}-

      - name: bootstrap
        run: make bootstrap
        working-directory: ${{ inputs.working-directory }}

      - name: check
        run: make check
        working-directory: ${{ inputs.working-directory }}
