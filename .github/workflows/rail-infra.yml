# The rail, for infrastructure repos (Terraform / Helm / Compose).
#
# Note: `make check` here is static only — fmt, lint, template, and (later)
# kubeconform. It never touches a cloud account and needs no credentials, which
# is what lets it run safely on a pull request from a fork.
#
# Actions are SHA-pinned — see rail-go.yml for why.
name: rail (infra)

on:
  workflow_call:
    inputs:
      terraform-version:
        type: string
        default: "1.16.0"
      helm-version:
        type: string
        default: "v4.2.3"
      working-directory:
        type: string
        default: "."
      runs-on:
        type: string
        default: "ubuntu-latest"

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ inputs.terraform-version }}
          terraform_wrapper: false

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ inputs.helm-version }}

      - name: bootstrap
        run: make bootstrap
        working-directory: ${{ inputs.working-directory }}

      - name: check
        run: make check
        working-directory: ${{ inputs.working-directory }}
