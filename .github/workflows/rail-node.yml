# The rail, for Node/TypeScript repos.
#
# Actions are SHA-pinned — see rail-go.yml for why.
name: rail (node)

on:
  workflow_call:
    inputs:
      node-version:
        description: "Node major version. Should match the repo's .nvmrc."
        type: string
        default: "22"
      working-directory:
        description: "Directory containing the Makefile."
        type: string
        default: "."
      runs-on:
        type: string
        default: "ubuntu-latest"

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

      - name: bootstrap
        run: make bootstrap
        working-directory: ${{ inputs.working-directory }}

      - name: check
        run: make check
        working-directory: ${{ inputs.working-directory }}
