# Delegation Pyramid position for this repo.
#
# `level` is the honest current state; `target` is justified by blast radius,
# not ambition. A future ratchet check (S1) reads this file and fails CI if
# `level` decreases or a gate listed here is removed — ratchets only tighten,
# and weakening one should be a loud, reviewable event.
schema: 1
repo: ci-workflows

level: rail
target: l1
rationale: >
  Pure CI definitions with no runtime code. Its blast radius is real but narrow:
  a break stops every pipeline in the portfolio, which is loud and immediate
  rather than silent. L1 (lint everything committed, including itself) is the
  correctly sized investment; there is nothing here for L2+ to check.

gates:
  - id: rail.verbs
    description: Standard verb set present and working.
    enabled: false
    note: >
      No Makefile — this repo contains only workflow definitions and is consumed
      by reference, never built. The rail it provides is for its consumers.
  - id: rail.self-check
    description: actionlint runs over this repo's own workflows.
    enabled: true

known_gaps:
  - No ratchet checker yet — this file is currently an input with no enforcer.

resolved_in_s0:
  - "Third-party actions were pinned to major tags recalled from memory
     (setup-go@v6, checkout@v5, cache@v4). setup-go@v6 does not exist, so every
     consuming repo failed to resolve its workflow before a single job started.
     Now SHA-pinned to verified commits with the version in a trailing comment.
     Pinning by SHA also closes the mutable-tag supply-chain hole, where whoever
     controls an action can repoint a major tag at new code that then runs with
     the calling workflow's permissions."

next_step: S1 — SHA-pin actions, add the L1 workflows, write the ratchet checker.
